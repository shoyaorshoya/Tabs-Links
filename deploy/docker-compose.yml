# ClosedTabs: runs only on this computer (127.0.0.1), no accounts, no login.
# Usage: ./start.sh from the project folder (or: docker compose up -d --build)
services:
  closedtabs:
    build: ../app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # reachable from this computer only
    env_file:
      - .env
    volumes:
      - closedtabs-data:/data

volumes:
  closedtabs-data:
